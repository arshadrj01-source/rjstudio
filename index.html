<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RJ STUDIO | Premium Pro Dashboard</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap">
  <style>
    :root {
      --bg: #050b15;
      --panel: #0a1322;
      --panel2: #0f1d33;
      --text: #edf4ff;
      --muted: #91a4c7;
      --accent: #7c5cff;
      --accent-glow: rgba(124, 92, 255, 0.4);
      --success: #00d764;
      --line: rgba(255, 255, 255, 0.08);
      --radius: 24px;
      --sidebar-width: 280px;
    }

    * { box-sizing: border-box; }
    body, html { margin: 0; padding: 0; height: 100%; font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; }
    button { cursor: pointer; border: none; font-family: inherit; transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    input, textarea, select { font-family: inherit; }

    /* --- UI ELEMENTS --- */
    .landing { height: 100vh; width: 100%; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; overflow: hidden; }
    .slideshow-bg { position: absolute; inset: 0; z-index: 1; }
    .slide { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; filter: brightness(0.4) saturate(0.9); transition: opacity 2s ease-in-out, transform 10s linear; transform: scale(1.1); }
    .slide.active { opacity: 1; transform: scale(1); }
    .landing-content { position: relative; z-index: 10; padding: 20px; }
    .landing h1 { font-family: 'Playfair Display', serif; font-size: clamp(50px, 12vw, 100px); margin: 0; font-weight: 700; letter-spacing: -2px; background: linear-gradient(to bottom, #fff, #b0c4de); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 0.9; }
    .tagline { color: var(--accent); font-weight: 800; letter-spacing: 6px; font-size: 14px; margin-bottom: 15px; display: block; text-transform: uppercase; }

    .landing-btns { display: flex; gap: 20px; justify-content: center; margin-top: 50px; }
    .btn-primary { background: var(--accent); color: white; padding: 16px 36px; border-radius: 50px; font-weight: 700; font-size: 15px; box-shadow: 0 10px 25px var(--accent-glow); }
    .btn-outline { background: rgba(255, 255, 255, 0.05); color: white; padding: 16px 36px; border-radius: 50px; font-weight: 700; border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(15px); }
    .btn-primary:hover, .btn-outline:hover { transform: translateY(-3px); filter: brightness(1.2); }

    .dashboard-container { display: flex; min-height: 100vh; }
    .sidebar { width: var(--sidebar-width); background: var(--panel); border-right: 1px solid var(--line); position: fixed; height: 100vh; display: flex; flex-direction: column; padding: 40px 24px; z-index: 100; }
    .sidebar-brand { font-family: 'Playfair Display', serif; font-size: 26px; color: #fff; margin-bottom: 45px; text-align: center; font-style: italic; }
    .nav-group { display: flex; flex-direction: column; gap: 8px; flex-grow: 1; }
    .nav-btn { width: 100%; padding: 14px 20px; border-radius: 16px; background: transparent; color: var(--muted); text-align: left; font-weight: 600; display: flex; align-items: center; gap: 15px; }
    .nav-btn.active { background: rgba(124, 92, 255, 0.15); color: var(--accent); border: 1px solid rgba(124, 92, 255, 0.2); }
    
    .main-content { margin-left: var(--sidebar-width); flex-grow: 1; padding: 60px; max-width: 1600px; }
    .header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; gap: 20px; flex-wrap: wrap; }
    .header-left h2 { margin: 0; font-size: 40px; text-transform: capitalize; font-family: 'Playfair Display'; }

    .control-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .search-bar, .sort-select { background: var(--panel); border: 1px solid var(--line); color: #fff; padding: 12px 20px; border-radius: 50px; outline: none; font-size: 14px; }
    .sort-select { border-radius: 12px; cursor: pointer; }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
    .stat-card { background: var(--panel); padding: 25px; border-radius: var(--radius); border: 1px solid var(--line); }
    .stat-card span { color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; }
    .stat-card h3 { margin: 8px 0 0; font-size: 26px; font-weight: 800; color: #fff; }

    .project-card { background: var(--panel); padding: 25px; border-radius: var(--radius); border: 1px solid var(--line); margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; transition: 0.3s; }
    .project-card:hover { border-color: var(--accent); transform: translateX(8px); background: #0e1829; cursor: pointer; }
    .project-info h4 { margin: 0 0 5px 0; font-size: 18px; }
    .project-meta { font-size: 13px; color: var(--muted); display: flex; gap: 15px; }
    
    .subtabs { display: flex; gap: 10px; margin-bottom: 30px; }
    .sub-btn { background: rgba(255,255,255,0.03); color: var(--muted); padding: 10px 25px; border-radius: 12px; font-weight: 700; font-size: 13px; }
    .sub-btn.active { background: var(--accent); color: #fff; }

    .overlay { position: fixed; inset: 0; background: rgba(5, 11, 21, 0.85); backdrop-filter: blur(12px); z-index: 150; display: none; }
    .drawer { position: fixed; right: 0; top: 0; bottom: 0; width: min(600px, 100vw); background: var(--panel2); z-index: 200; transform: translateX(100%); transition: 0.5s cubic-bezier(0.16, 1, 0.3, 1); padding: 50px 40px; border-left: 1px solid var(--line); overflow-y: auto; }
    .drawer.open { transform: translateX(0); }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .form-group { margin-bottom: 20px; }
    .full-width { grid-column: span 2; }
    .form-group label { display: block; color: var(--muted); font-size: 11px; font-weight: 700; margin-bottom: 8px; text-transform: uppercase; }
    .form-input { width: 100%; background: var(--bg); border: 1px solid var(--line); color: #fff; padding: 14px; border-radius: 12px; outline: none; font-size: 14px; }
    .form-input:focus { border-color: var(--accent); }

    .pill { padding: 8px 18px; border-radius: 12px; font-size: 11px; font-weight: 800; }
    .pill-paid { background: rgba(0, 215, 100, 0.1); color: #00d764; }
    .pill-pending { background: rgba(124, 92, 255, 0.1); color: var(--accent); }

    @media (max-width: 1000px) {
      .sidebar { width: 80px; padding: 30px 10px; }
      .sidebar-brand, .nav-btn span { display: none; }
      .main-content { margin-left: 80px; padding: 25px; }
    }
  </style>
</head>
<body>

<div id="app"></div>
<div id="overlay" class="overlay" onclick="closeDrawer()"></div>
<div id="drawer" class="drawer"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBplrfMrSg2E2ainAwu2NXzYBpVUOpT26w",
    authDomain: "rjstudio-ae970.firebaseapp.com",
    projectId: "rjstudio-ae970",
    storageBucket: "rjstudio-ae970.firebasestorage.app",
    messagingSenderId: "32654512317",
    appId: "1:32654512317:web:aa0424fb192b5bedf727d4"
  };

  const fb = initializeApp(firebaseConfig);
  const db = getFirestore(fb);
  const projectsRef = collection(db, "projects");

  const state = { 
    view: 'landing', currentTab: 'shooting', albumSubTab: 'pending', 
    searchQuery: '', sortBy: 'weddingDate', sortOrder: 'asc', projects: [] 
  };

  const money = (val) => new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(val || 0);

  function render() {
    const root = document.getElementById('app');
    const activeElementId = document.activeElement ? document.activeElement.id : null;
    const selectionStart = document.activeElement ? document.activeElement.selectionStart : null;

    if (state.view === 'landing') {
      root.innerHTML = renderLanding();
      initSlideshow();
    } else {
      root.innerHTML = renderDashboard();
    }

    if (activeElementId) {
      const el = document.getElementById(activeElementId);
      if (el) { el.focus(); if (selectionStart !== null) el.setSelectionRange(selectionStart, selectionStart); }
    }
  }

  function renderLanding() {
    return `
      <div class="landing">
        <div class="slideshow-bg"><img class="slide active" src="https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1920&q=80" /></div>
        <div class="landing-content">
          <span class="tagline">Cinematic Excellence</span>
          <h1>RJ STUDIO</h1>
          <div class="landing-btns">
            <button class="btn-primary" onclick="window.setView('dashboard')">Open Dashboard</button>
            <button class="btn-outline" onclick="window.openAddDrawer()">+ New Project</button>
          </div>
        </div>
      </div>
    `;
  }

  function renderDashboard() {
    let filtered = (state.currentTab === 'albums') 
        ? state.projects.filter(p => p.isAlbum === true && p.albumStatus === state.albumSubTab)
        : state.projects.filter(p => p.stage === state.currentTab);

    if (state.searchQuery) {
        filtered = filtered.filter(p => p.name?.toLowerCase().includes(state.searchQuery.toLowerCase()));
    }

    filtered.sort((a, b) => {
        const valA = a[state.sortBy] || ''; const valB = b[state.sortBy] || '';
        return state.sortOrder === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
    });

    // --- LOGIC: SEPARATED COUNTERS ---
    let revTitle = "Total Revenue", recvTitle = "Received";
    let totalRev = 0, totalRecv = 0;

    if (state.currentTab === 'albums') {
        revTitle = "Album Revenue"; recvTitle = "Album Received";
        totalRev = filtered.reduce((acc, p) => acc + (Number(p.albumAmount) || 0), 0);
        totalRecv = filtered.reduce((acc, p) => p.albumPaid ? acc + (Number(p.albumAmount) || 0) : acc, 0);
    } else {
        totalRev = filtered.reduce((acc, p) => acc + (Number(p.totalAmount) || 0), 0);
        totalRecv = filtered.reduce((acc, p) => p.clientPaid ? acc + (Number(p.totalAmount) || 0) : acc, 0);
    }
    const totalFree = filtered.reduce((acc, p) => acc + (Number(p.freelancerAmount) || 0), 0);

    return `
      <div class="dashboard-container">
        <aside class="sidebar">
          <div class="sidebar-brand">RJ Studio</div>
          <nav class="nav-group">
            <button class="nav-btn ${state.currentTab === 'shooting' ? 'active' : ''}" onclick="window.setTab('shooting')">🎥 <span>Shooting</span></button>
            <button class="nav-btn ${state.currentTab === 'editing' ? 'active' : ''}" onclick="window.setTab('editing')">✂️ <span>Editing</span></button>
            <button class="nav-btn ${state.currentTab === 'delivery' ? 'active' : ''}" onclick="window.setTab('delivery')">📦 <span>Delivery</span></button>
            <button class="nav-btn ${state.currentTab === 'completed' ? 'active' : ''}" onclick="window.setTab('completed')">🏆 <span>Completed</span></button>
            <button class="nav-btn ${state.currentTab === 'albums' ? 'active' : ''}" onclick="window.setTab('albums')" style="margin-top:15px; border-top:1px solid var(--line); padding-top:20px;">📚 <span>Albums</span></button>
          </nav>
          <button class="nav-btn" onclick="window.setView('landing')">🏠 <span>Exit</span></button>
        </aside>

        <main class="main-content">
          <header class="header-actions">
            <div class="header-left">
              <h2>${state.currentTab}</h2>
              <p style="color:var(--muted); margin-top:5px;">${state.currentTab === 'albums' ? 'Physical Archive Management' : 'Workflow Overview'}</p>
            </div>
            <div class="control-row">
              <select class="sort-select" onchange="window.handleSortChange('sortBy', this.value)">
                <option value="weddingDate" ${state.sortBy === 'weddingDate' ? 'selected' : ''}>By Wedding Date</option>
                <option value="deadline" ${state.sortBy === 'deadline' ? 'selected' : ''}>By Deadline</option>
              </select>
              <select class="sort-select" onchange="window.handleSortChange('sortOrder', this.value)">
                <option value="asc" ${state.sortOrder === 'asc' ? 'selected' : ''}>Ascending</option>
                <option value="desc" ${state.sortOrder === 'desc' ? 'selected' : ''}>Descending</option>
              </select>
              <input type="text" id="main_search" placeholder="Search..." class="search-bar" oninput="window.handleSearch(this.value)" value="${state.searchQuery}">
              <button class="btn-primary" onclick="window.openAddDrawer()">+ Add Project</button>
            </div>
          </header>

          ${state.currentTab === 'albums' ? `
            <div class="subtabs">
                <button class="sub-btn ${state.albumSubTab === 'pending' ? 'active' : ''}" onclick="window.setAlbumSubTab('pending')">Pending Albums</button>
                <button class="sub-btn ${state.albumSubTab === 'completed' ? 'active' : ''}" onclick="window.setAlbumSubTab('completed')">Completed Albums</button>
            </div>
          ` : ''}

          <div class="stats-grid">
            <div class="stat-card"><span>Projects</span><h3>${filtered.length}</h3></div>
            <div class="stat-card"><span>${revTitle}</span><h3>${money(totalRev)}</h3></div>
            <div class="stat-card"><span>${recvTitle}</span><h3 style="color:var(--success)">${money(totalRecv)}</h3></div>
            ${state.currentTab !== 'albums' ? `<div class="stat-card"><span>Freelancer Total</span><h3 style="color:var(--accent)">${money(totalFree)}</h3></div>` : ''}
          </div>

          <div class="project-list">
            ${filtered.map(p => `
              <div class="project-card" onclick="window.openProject('${p.id}')">
                <div class="project-info">
                  <h4>${p.name}</h4>
                  <div class="project-meta">
                    <span>📅 Wedding: ${p.weddingDate || 'N/A'}</span>
                    <span>⏰ Deadline: <b>${p.deadline || 'N/A'}</b></span>
                    <span>📦 ${p.package || 'Standard'}</span>
                  </div>
                </div>
                <div style="display:flex; gap:10px; align-items:center;">
                  ${p.isAlbum ? '<span style="font-size:18px;">📚</span>' : ''}
                  <div class="pill ${ (state.currentTab === 'albums' ? p.albumPaid : p.clientPaid) ? 'pill-paid' : 'pill-pending'}">
                    ${(state.currentTab === 'albums' ? p.albumPaid : p.clientPaid) ? 'PAID' : 'PENDING'}
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        </main>
      </div>
    `;
  }

  // --- DRAWER ACTIONS ---
  window.toggleAlbumField = (prefix) => {
    const isAlbum = document.getElementById(prefix + '_album').value === 'yes';
    document.getElementById(prefix + '_album_amt_group').style.display = isAlbum ? 'block' : 'none';
  };

  window.openAddDrawer = () => {
    const d = document.getElementById('drawer');
    d.innerHTML = `
      <h2 style="font-family:'Playfair Display'; font-size:32px; margin-top:0;">New Project</h2>
      <div class="form-grid">
        <div class="form-group full-width"><label>Client Name</label><input type="text" id="n_name" class="form-input"></div>
        <div class="form-group"><label>Phone</label><input type="text" id="n_phone" class="form-input"></div>
        <div class="form-group"><label>Wedding Date</label><input type="date" id="n_wdate" class="form-input"></div>
        <div class="form-group"><label>Project Amount (Shooting/Editing)</label><input type="number" id="n_amt" class="form-input"></div>
        <div class="form-group"><label>Freelancer Pay</label><input type="number" id="n_famt" class="form-input" value="0"></div>
        <div class="form-group"><label>Package</label><input type="text" id="n_pkg" class="form-input"></div>
        <div class="form-group"><label>Deadline</label><input type="date" id="n_dead" class="form-input"></div>
        <div class="form-group"><label>Include Album?</label>
            <select id="n_album" class="form-input" onchange="window.toggleAlbumField('n')">
                <option value="no">No</option><option value="yes">Yes</option>
            </select>
        </div>
        <div class="form-group" id="n_album_amt_group" style="display:none;"><label>Album Price</label><input type="number" id="n_album_amt" class="form-input" value="0"></div>
        <div class="form-group full-width"><label>Notes</label><textarea id="n_note" class="form-input" style="height:80px"></textarea></div>
      </div>
      <button class="btn-primary" style="width:100%; margin-top:20px;" onclick="window.saveNewProject()">Save Project</button>
      <button class="btn-outline" style="width:100%; margin-top:10px;" onclick="closeDrawer()">Cancel</button>
    `;
    d.classList.add('open');
    document.getElementById('overlay').style.display = 'block';
  };

  window.saveNewProject = async () => {
    const isAlbum = document.getElementById('n_album').value === 'yes';
    const data = {
      name: document.getElementById('n_name').value, phone: document.getElementById('n_phone').value,
      weddingDate: document.getElementById('n_wdate').value, totalAmount: Number(document.getElementById('n_amt').value),
      freelancerAmount: Number(document.getElementById('n_famt').value), package: document.getElementById('n_pkg').value,
      deadline: document.getElementById('n_dead').value, isAlbum: isAlbum,
      albumAmount: isAlbum ? Number(document.getElementById('n_album_amt').value) : 0,
      albumStatus: 'pending', albumPaid: false, note: document.getElementById('n_note').value,
      stage: 'shooting', clientPaid: false, createdAt: serverTimestamp()
    };
    await addDoc(projectsRef, data); closeDrawer();
  };

  window.openEditDrawer = (id) => {
    const p = state.projects.find(x => x.id === id);
    const d = document.getElementById('drawer');
    d.innerHTML = `
      <h2 style="font-family:'Playfair Display'; font-size:32px; margin-top:0;">Edit Details</h2>
      <div class="form-grid">
        <div class="form-group full-width"><label>Client Name</label><input type="text" id="e_name" class="form-input" value="${p.name}"></div>
        <div class="form-group"><label>Phone</label><input type="text" id="e_phone" class="form-input" value="${p.phone || ''}"></div>
        <div class="form-group"><label>Wedding Date</label><input type="date" id="e_wdate" class="form-input" value="${p.weddingDate || ''}"></div>
        <div class="form-group"><label>Project Amount</label><input type="number" id="e_amt" class="form-input" value="${p.totalAmount}"></div>
        <div class="form-group"><label>Freelancer Pay</label><input type="number" id="e_famt" class="form-input" value="${p.freelancerAmount}"></div>
        <div class="form-group"><label>Package</label><input type="text" id="e_pkg" class="form-input" value="${p.package || ''}"></div>
        <div class="form-group"><label>Deadline</label><input type="date" id="e_dead" class="form-input" value="${p.deadline || ''}"></div>
        <div class="form-group"><label>Include Album?</label>
            <select id="e_album" class="form-input" onchange="window.toggleAlbumField('e')">
                <option value="no" ${!p.isAlbum ? 'selected' : ''}>No</option><option value="yes" ${p.isAlbum ? 'selected' : ''}>Yes</option>
            </select>
        </div>
        <div class="form-group" id="e_album_amt_group" style="display:${p.isAlbum ? 'block' : 'none'};"><label>Album Price</label><input type="number" id="e_album_amt" class="form-input" value="${p.albumAmount || 0}"></div>
        <div class="form-group full-width"><label>Notes</label><textarea id="e_note" class="form-input" style="height:80px">${p.note || ''}</textarea></div>
      </div>
      <button class="btn-primary" style="width:100%; margin-top:20px;" onclick="window.updateProjectDetails('${id}')">Update Project</button>
      <button class="btn-outline" style="width:100%; margin-top:10px;" onclick="window.openProject('${id}')">Back to View</button>
    `;
  };

  window.updateProjectDetails = async (id) => {
    const isAlbum = document.getElementById('e_album').value === 'yes';
    const upd = {
      name: document.getElementById('e_name').value, phone: document.getElementById('e_phone').value,
      weddingDate: document.getElementById('e_wdate').value, totalAmount: Number(document.getElementById('e_amt').value),
      freelancerAmount: Number(document.getElementById('e_famt').value), package: document.getElementById('e_pkg').value,
      deadline: document.getElementById('e_dead').value, isAlbum: isAlbum,
      albumAmount: isAlbum ? Number(document.getElementById('e_album_amt').value) : 0,
      note: document.getElementById('e_note').value
    };
    await updateDoc(doc(db, "projects", id), upd); window.openProject(id);
  };

  window.openProject = (id) => {
    const p = state.projects.find(x => x.id === id);
    const d = document.getElementById('drawer');
    d.innerHTML = `
      <h1 style="font-family:'Playfair Display'; margin-top:0;">${p.name}</h1>
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:25px; margin-bottom:30px;">
        <div><label style="font-size:10px; color:var(--muted)">PHONE</label><div>${p.phone || 'N/A'}</div></div>
        <div><label style="font-size:10px; color:var(--muted)">WEDDING DATE</label><div>${p.weddingDate || 'N/A'}</div></div>
        <div><label style="font-size:10px; color:var(--muted)">DEADLINE</label><div style="color:var(--accent); font-weight:700;">${p.deadline || 'N/A'}</div></div>
        <div><label style="font-size:10px; color:var(--muted)">PACKAGE</label><div>${p.package || 'N/A'}</div></div>
        <div><label style="font-size:10px; color:var(--muted)">PROJECT REVENUE</label><div style="font-weight:700">${money(p.totalAmount)}</div></div>
        <div><label style="font-size:10px; color:var(--muted)">PROJECT PAYMENT</label><div>${p.clientPaid ? 'Paid ✓' : 'Pending'}</div></div>
        ${p.isAlbum ? `
            <div><label style="font-size:10px; color:var(--muted)">ALBUM AMOUNT</label><div style="color:var(--success); font-weight:700">${money(p.albumAmount)}</div></div>
            <div><label style="font-size:10px; color:var(--muted)">ALBUM PAYMENT</label><div>${p.albumPaid ? 'Paid ✓' : 'Pending'}</div></div>
        ` : ''}
      </div>
      <div style="margin-bottom:30px;"><label style="font-size:10px; color:var(--muted)">NOTES</label><p style="font-size:14px; background:var(--bg); padding:15px; border-radius:10px;">${p.note || 'None'}</p></div>
      
      <div style="display:grid; gap:10px;">
        <button class="btn-primary" onclick="window.updatePaid('${p.id}', ${!p.clientPaid})">${p.clientPaid ? 'Unmark Project Paid' : 'Mark Project Paid'}</button>
        ${p.isAlbum ? `<button class="btn-primary" style="background:#00d764" onclick="window.updateAlbumPaid('${p.id}', ${!p.albumPaid})">${p.albumPaid ? 'Unmark Album Paid' : 'Mark Album Paid'}</button>` : ''}
        ${p.isAlbum && p.albumStatus === 'pending' ? `<button class="btn-primary" style="background:#7c5cff" onclick="window.updateAlbumStatus('${p.id}', 'completed')">Mark Album Done ✓</button>` : ''}
        <button class="btn-outline" onclick="window.openEditDrawer('${p.id}')">Edit Project Details</button>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <button class="btn-outline" onclick="window.moveStage('${p.id}', 'editing')">To Editing</button>
            <button class="btn-outline" onclick="window.moveStage('${p.id}', 'delivery')">To Delivery</button>
        </div>
        <button class="btn-outline" style="color:#ff4d4d" onclick="window.deleteProj('${p.id}')">Delete Project</button>
      </div>
    `;
    d.classList.add('open');
    document.getElementById('overlay').style.display = 'block';
  };

  window.handleSortChange = (key, val) => { state[key] = val; render(); };
  window.closeDrawer = () => { document.getElementById('drawer').classList.remove('open'); document.getElementById('overlay').style.display = 'none'; };
  window.setView = (v) => { state.view = v; render(); };
  window.setTab = (t) => { state.currentTab = t; render(); };
  window.setAlbumSubTab = (s) => { state.albumSubTab = s; render(); };
  window.handleSearch = (v) => { state.searchQuery = v; render(); };

  window.moveStage = async (id, stage) => { await updateDoc(doc(db, "projects", id), { stage }); closeDrawer(); };
  window.updatePaid = async (id, val) => { await updateDoc(doc(db, "projects", id), { clientPaid: val }); closeDrawer(); };
  window.updateAlbumPaid = async (id, val) => { await updateDoc(doc(db, "projects", id), { albumPaid: val }); closeDrawer(); };
  window.updateAlbumStatus = async (id, status) => { await updateDoc(doc(db, "projects", id), { albumStatus: status }); closeDrawer(); };
  window.deleteProj = async (id) => { if(confirm("Delete?")) { await deleteDoc(doc(db, "projects", id)); closeDrawer(); } };

  window.initSlideshow = () => {
    let cur = 0; const s = document.querySelectorAll('.slide');
    if(s.length) setInterval(() => { s[cur].classList.remove('active'); cur = (cur+1)%s.length; s[cur].classList.add('active'); }, 5000);
  };

  onSnapshot(query(projectsRef, orderBy("createdAt", "desc")), (snap) => {
    state.projects = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  });
  render();
</script>
</body>
</html>
