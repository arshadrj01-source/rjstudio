<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RJ STUDIO | Premium Dashboard</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap">
  <style>
    :root {
      --bg: #050b15;
      --panel: #0a1322;
      --panel2: #0f1d33;
      --text: #edf4ff;
      --muted: #91a4c7;
      --accent: #7c5cff;
      --accent-glow: rgba(124, 92, 255, 0.4);
      --success: #00d764;
      --danger: #ff4d4d;
      --line: rgba(255, 255, 255, 0.08);
      --radius: 24px;
    }

    * { box-sizing: border-box; }
    body, html { margin: 0; padding: 0; height: 100%; font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; }
    button { cursor: pointer; border: none; font-family: inherit; transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    input, textarea, select { font-family: inherit; }

    /* --- LANDING --- */
    .landing { height: 100vh; width: 100%; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; overflow: hidden; }
    .slideshow-bg { position: absolute; inset: 0; z-index: 1; }
    .slide { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; filter: brightness(0.4) saturate(0.9); transition: opacity 2s ease-in-out; }
    .slide.active { opacity: 1; }
    .landing-content { position: relative; z-index: 10; padding: 20px; }
    .landing h1 { font-family: 'Playfair Display', serif; font-size: clamp(50px, 12vw, 100px); margin: 0; font-weight: 700; letter-spacing: -2px; background: linear-gradient(to bottom, #fff, #b0c4de); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 0.9; }
    
    .btn-primary { background: var(--accent); color: white; padding: 16px 36px; border-radius: 50px; font-weight: 700; font-size: 15px; box-shadow: 0 10px 25px var(--accent-glow); margin-top: 40px; }
    .btn-outline { background: rgba(255, 255, 255, 0.05); color: white; padding: 14px 24px; border-radius: 12px; font-weight: 700; border: 1px solid rgba(255,255,255,0.2); }
    .btn-primary:hover, .btn-outline:hover { transform: translateY(-3px); filter: brightness(1.2); }

    /* --- DASHBOARD --- */
    .dashboard-container { min-height: 100vh; padding: 40px 20px; max-width: 1000px; margin: 0 auto; }
    .header-actions { display: flex; flex-direction: column; gap: 20px; margin-bottom: 40px; }
    .header-top { display: flex; justify-content: space-between; align-items: center; }
    .header-top h2 { margin: 0; font-size: 32px; font-family: 'Playfair Display'; }
    
    .control-row { display: flex; gap: 12px; flex-wrap: wrap; }
    .search-bar, .sort-select { background: var(--panel); border: 1px solid var(--line); color: #fff; padding: 12px 20px; border-radius: 12px; outline: none; font-size: 14px; flex-grow: 1; }
    .sort-select { cursor: pointer; flex-grow: 0; }

    /* --- PROJECT LIST --- */
    .project-card { background: var(--panel); padding: 20px 25px; border-radius: 16px; border: 1px solid var(--line); margin-bottom: 12px; display: flex; align-items: center; gap: 20px; transition: 0.3s; cursor: pointer; }
    .project-card:hover { border-color: var(--accent); transform: translateX(5px); background: #0e1829; }
    .project-number { font-size: 20px; font-weight: 800; color: var(--muted); opacity: 0.5; min-width: 30px; }
    .project-info { flex-grow: 1; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; align-items: center; }
    .project-info h4 { margin: 0; font-size: 18px; color: #fff; }
    .project-meta { font-size: 14px; color: var(--muted); }

    /* --- DRAWER --- */
    .overlay { position: fixed; inset: 0; background: rgba(5, 11, 21, 0.85); backdrop-filter: blur(12px); z-index: 150; display: none; }
    .drawer { position: fixed; right: 0; top: 0; bottom: 0; width: min(600px, 100vw); background: var(--panel2); z-index: 200; transform: translateX(100%); transition: 0.4s ease; padding: 40px; border-left: 1px solid var(--line); overflow-y: auto; }
    .drawer.open { transform: translateX(0); }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .form-group { margin-bottom: 15px; }
    .full-width { grid-column: span 2; }
    .form-group label { display: block; color: var(--muted); font-size: 11px; font-weight: 700; margin-bottom: 8px; text-transform: uppercase; }
    .form-input { width: 100%; background: var(--bg); border: 1px solid var(--line); color: #fff; padding: 14px; border-radius: 12px; outline: none; font-size: 14px; }
    .form-input:focus { border-color: var(--accent); }
    .calc-box { background: rgba(124, 92, 255, 0.1); padding: 20px; border-radius: 12px; border: 1px solid var(--accent); text-align: center; margin-top: 10px; }
    .calc-box div { font-size: 24px; font-weight: 800; color: #fff; margin-top: 5px; }

    .details-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; background: var(--bg); padding: 20px; border-radius: 16px; border: 1px solid var(--line); }
    .details-item label { font-size: 10px; color: var(--muted); text-transform: uppercase; font-weight: 700; display: block; margin-bottom: 4px; }
    .details-item div { font-size: 15px; font-weight: 600; }

    @media (max-width: 768px) {
      .project-info { grid-template-columns: 1fr; gap: 5px; }
      .form-grid, .details-grid { grid-template-columns: 1fr; }
      .full-width { grid-column: span 1; }
      .drawer { padding: 30px 20px; }
    }
  </style>
</head>
<body>

<div id="app"></div>
<div id="overlay" class="overlay" onclick="closeDrawer()"></div>
<div id="drawer" class="drawer"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBplrfMrSg2E2ainAwu2NXzYBpVUOpT26w",
    authDomain: "rjstudio-ae970.firebaseapp.com",
    projectId: "rjstudio-ae970",
    storageBucket: "rjstudio-ae970.firebasestorage.app",
    messagingSenderId: "32654512317",
    appId: "1:32654512317:web:aa0424fb192b5bedf727d4"
  };

  const fb = initializeApp(firebaseConfig);
  const db = getFirestore(fb);
  const projectsRef = collection(db, "projects");

  const state = { 
    view: 'landing', 
    searchQuery: '', 
    sortOrder: 'asc', 
    projects: [] 
  };

  const money = (val) => new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(val || 0);

  function render() {
    const root = document.getElementById('app');
    if (state.view === 'landing') {
      root.innerHTML = renderLanding();
    } else {
      root.innerHTML = renderDashboard();
    }
  }

  function renderLanding() {
    return `
      <div class="landing">
        <div class="slideshow-bg"><img class="slide active" src="https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1920&q=80" /></div>
        <div class="landing-content">
          <h1>RJ STUDIO</h1>
          <button class="btn-primary" onclick="window.setView('dashboard')">Open Dashboard</button>
        </div>
      </div>
    `;
  }

  function renderDashboard() {
    let filtered = state.projects.filter(p => 
      (p.clientName || '').toLowerCase().includes(state.searchQuery.toLowerCase())
    );

    filtered.sort((a, b) => {
      const dateA = a.weddingDate || ''; 
      const dateB = b.weddingDate || '';
      return state.sortOrder === 'asc' ? dateA.localeCompare(dateB) : dateB.localeCompare(dateA);
    });

    return `
      <div class="dashboard-container">
        <div class="header-actions">
          <div class="header-top">
            <h2>Wedding List</h2>
            <button class="btn-outline" onclick="window.setView('landing')" style="padding: 8px 16px; border:none;">← Exit</button>
          </div>
          
          <div class="control-row">
            <input type="text" placeholder="Search by Client Name..." class="search-bar" oninput="window.handleSearch(this.value)" value="${state.searchQuery}">
            <select class="sort-select" onchange="window.handleSort(this.value)">
              <option value="asc" ${state.sortOrder === 'asc' ? 'selected' : ''}>Date: Earliest First</option>
              <option value="desc" ${state.sortOrder === 'desc' ? 'selected' : ''}>Date: Latest First</option>
            </select>
            <button class="btn-outline" style="background: var(--accent); border-color: var(--accent);" onclick="window.openAddDrawer()">+ Add New Project</button>
          </div>
        </div>

        <div class="project-list">
          ${filtered.length === 0 ? '<div style="text-align:center; color:var(--muted); padding: 40px;">No weddings found.</div>' : ''}
          ${filtered.map((p, index) => `
            <div class="project-card" onclick="window.openProject('${p.id}')">
              <div class="project-number">${index + 1}</div>
              <div class="project-info">
                <h4>${p.clientName}</h4>
                <div class="project-meta">📅 ${p.weddingDate || 'No Date'}</div>
                <div class="project-meta">📍 ${p.location || 'No Location'}</div>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }

  // --- DRAWER ACTIONS ---

  window.calculateAmountToReceive = () => {
    const total = Number(document.getElementById('f_total').value) || 0;
    const advance = Number(document.getElementById('f_adv').value) || 0;
    const albumAmt = Number(document.getElementById('f_album_amt').value) || 0;
    const receive = (total - advance) + albumAmt;
    document.getElementById('f_receive_display').innerText = money(receive);
  };

  // Shared form template for Add and Edit
  function renderForm(title, project = {}, isEdit = false) {
    return `
      <h2 style="font-family:'Playfair Display'; font-size:32px; margin-top:0;">${title}</h2>
      <div class="form-grid">
        <div class="form-group"><label>Client Name</label><input type="text" id="f_client" class="form-input" value="${project.clientName || ''}"></div>
        <div class="form-group"><label>Wedding Date</label><input type="date" id="f_date" class="form-input" value="${project.weddingDate || ''}"></div>
        <div class="form-group"><label>Groom Name</label><input type="text" id="f_groom" class="form-input" value="${project.groomName || ''}"></div>
        <div class="form-group"><label>Bride Name</label><input type="text" id="f_bride" class="form-input" value="${project.brideName || ''}"></div>
        <div class="form-group"><label>Phone Number</label><input type="text" id="f_phone" class="form-input" value="${project.phone || ''}"></div>
        <div class="form-group"><label>Location</label><input type="text" id="f_location" class="form-input" value="${project.location || ''}"></div>
        <div class="form-group full-width"><label>Address</label><input type="text" id="f_address" class="form-input" value="${project.address || ''}"></div>
        <div class="form-group"><label>Package Type</label><input type="text" id="f_pkg" class="form-input" value="${project.packageType || ''}"></div>
        <div class="form-group"><label>Album Included?</label>
          <select id="f_album" class="form-input">
              <option value="Yes" ${project.album === 'Yes' ? 'selected' : ''}>Yes</option>
              <option value="No" ${project.album === 'No' ? 'selected' : ''}>No</option>
          </select>
        </div>
        <div class="form-group"><label>Total Amount</label><input type="number" id="f_total" class="form-input" value="${project.totalAmount || 0}" oninput="window.calculateAmountToReceive()"></div>
        <div class="form-group"><label>Advance Paid</label><input type="number" id="f_adv" class="form-input" value="${project.advance || 0}" oninput="window.calculateAmountToReceive()"></div>
        <div class="form-group full-width"><label>Album Amount</label><input type="number" id="f_album_amt" class="form-input" value="${project.albumAmount || 0}" oninput="window.calculateAmountToReceive()"></div>
      </div>
      <div class="calc-box full-width">
        <label style="color:var(--muted); font-size:12px; font-weight:700; text-transform:uppercase;">Amount To Receive</label>
        <div id="f_receive_display">${money(project.amountToReceive || 0)}</div>
      </div>
      <button class="btn-primary" style="width:100%; margin-top:20px;" onclick="${isEdit ? `window.updateProject('${project.id}')` : 'window.saveNewProject()'}">${isEdit ? 'Update Project' : 'Save Project'}</button>
      <button class="btn-outline" style="width:100%; margin-top:10px; border:none;" onclick="${isEdit ? `window.openProject('${project.id}')` : 'closeDrawer()'}">Cancel</button>
    `;
  }

  window.openAddDrawer = () => {
    const d = document.getElementById('drawer');
    d.innerHTML = renderForm('New Project');
    d.classList.add('open');
    document.getElementById('overlay').style.display = 'block';
  };

  window.openEditDrawer = (id) => {
    const project = state.projects.find(x => x.id === id);
    const d = document.getElementById('drawer');
    d.innerHTML = renderForm('Edit Project', project, true);
    d.classList.add('open');
  };

  const getFormData = () => {
    const total = Number(document.getElementById('f_total').value) || 0;
    const advance = Number(document.getElementById('f_adv').value) || 0;
    const albumAmt = Number(document.getElementById('f_album_amt').value) || 0;
    return {
      clientName: document.getElementById('f_client').value,
      weddingDate: document.getElementById('f_date').value,
      groomName: document.getElementById('f_groom').value,
      brideName: document.getElementById('f_bride').value,
      phone: document.getElementById('f_phone').value,
      location: document.getElementById('f_location').value,
      address: document.getElementById('f_address').value,
      packageType: document.getElementById('f_pkg').value,
      album: document.getElementById('f_album').value,
      totalAmount: total,
      advance: advance,
      albumAmount: albumAmt,
      amountToReceive: (total - advance) + albumAmt
    };
  };

  window.saveNewProject = async () => {
    const data = { ...getFormData(), createdAt: serverTimestamp() };
    await addDoc(projectsRef, data); 
    closeDrawer();
  };

  window.updateProject = async (id) => {
    const data = getFormData();
    await updateDoc(doc(db, "projects", id), data);
    window.openProject(id); // Go back to details after update
  };

  window.openProject = (id) => {
    const p = state.projects.find(x => x.id === id);
    const d = document.getElementById('drawer');
    d.innerHTML = `
      <h1 style="font-family:'Playfair Display'; margin-top:0; font-size: 36px;">${p.clientName}</h1>
      <div class="details-grid">
        <div class="details-item"><label>Groom Name</label><div>${p.groomName || '-'}</div></div>
        <div class="details-item"><label>Bride Name</label><div>${p.brideName || '-'}</div></div>
        <div class="details-item"><label>Wedding Date</label><div>${p.weddingDate || '-'}</div></div>
        <div class="details-item"><label>Location</label><div>${p.location || '-'}</div></div>
        <div class="details-item"><label>Phone Number</label><div>${p.phone || '-'}</div></div>
        <div class="details-item"><label>Package Type</label><div>${p.packageType || '-'}</div></div>
        <div class="details-item full-width"><label>Address</label><div>${p.address || '-'}</div></div>
        <div class="details-item full-width"><label>Album</label><div>${p.album || 'No'}</div></div>
      </div>
      <div class="details-grid" style="border-color: var(--accent);">
        <div class="details-item"><label>Total Amount</label><div>${money(p.totalAmount)}</div></div>
        <div class="details-item"><label>Advance Paid</label><div style="color:var(--danger);">${money(p.advance)}</div></div>
        <div class="details-item"><label>Album Amount</label><div>${money(p.albumAmount)}</div></div>
        <div class="details-item"><label>Amount To Receive</label><div style="color:var(--success); font-size:18px;">${money(p.amountToReceive)}</div></div>
      </div>
      <div style="display:grid; gap:10px; margin-top: 20px;">
        <button class="btn-primary" style="margin-top:0;" onclick="window.openEditDrawer('${p.id}')">Edit Project</button>
        <button class="btn-outline" style="color:var(--danger); border-color: rgba(255, 77, 77, 0.3);" onclick="window.deleteProj('${p.id}')">Delete Project</button>
      </div>
    `;
    d.classList.add('open');
    document.getElementById('overlay').style.display = 'block';
  };

  window.handleSort = (val) => { state.sortOrder = val; render(); };
  window.handleSearch = (val) => { state.searchQuery = val; render(); };
  window.setView = (v) => { state.view = v; render(); };
  window.closeDrawer = () => { document.getElementById('drawer').classList.remove('open'); document.getElementById('overlay').style.display = 'none'; };
  
  window.deleteProj = async (id) => { 
    if(confirm("Are you sure you want to delete this wedding project?")) { 
      await deleteDoc(doc(db, "projects", id)); 
      closeDrawer(); 
    } 
  };

  onSnapshot(query(projectsRef, orderBy("createdAt", "desc")), (snap) => {
    state.projects = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  });
  
  render();
</script>
</body>
</html>
